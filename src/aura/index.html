<!doctype html><html><head><meta charset="utf-8"><title>aura</title>
<style>
html,body{margin:0;padding:0;background:#04030a;overflow:hidden;width:1080px;height:1920px}
#c{position:absolute;left:0;top:0;width:1080px;height:1920px;display:block}
/* Meta Reels güvenli bölge: üst 270 / alt 672 / yan 65 px. Altyazı metninin alt kenarı ~y=1199 (<1235), scrim alt kenarı y=1246. */
#cap{position:absolute;left:0;width:1080px;bottom:674px;display:flex;justify-content:center;opacity:0}
#capin{position:relative;box-sizing:content-box;max-width:760px;padding:46px 80px;text-align:center;font-family:Inter,'DejaVu Sans',sans-serif;font-weight:700;font-size:50px;line-height:1.24;color:#fff;letter-spacing:-.005em;text-shadow:0 2px 10px rgba(0,0,0,.85),0 0 24px rgba(0,0,0,.55)}
#capin::before{content:'';position:absolute;left:0;right:0;top:0;bottom:0;z-index:-1;background:rgba(0,0,0,.58);
  -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%),linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;mask-image:linear-gradient(to bottom,transparent 0,#000 26%,#000 74%,transparent 100%),linear-gradient(to right,transparent 0,#000 12%,#000 88%,transparent 100%)}
#capin span{opacity:.64}
#capin span.on{opacity:1}
#disc{position:absolute;left:65px;width:950px;top:288px;text-align:center;font-family:Inter,'DejaVu Sans',sans-serif;font-weight:500;font-size:28px;line-height:36px;color:#fff;opacity:.92;white-space:nowrap;text-shadow:0 1px 8px rgba(0,0,0,.9)}
body.notext #capin,body.notext #disc{color:transparent;text-shadow:none}
body.notext #capin span,body.notext #capin span.on{opacity:1}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="cap"><div id="capin"></div></div><div id="disc">Spiritüel inanışlara dayalı içeriktir · Tıbbi tedavinin yerine geçmez</div>
<script src="three.min.js"></script>
<script src="scene.js"></script>
</body></html>
